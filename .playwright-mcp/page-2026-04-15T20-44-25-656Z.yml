      - paragraph [ref=e30]: Steel City Cleanouts is a family-owned junk removal and estate cleanout company based in the Pittsburgh region. Fully insured, 7 days a week, upfront pricing.
      - heading "Who We Are" [level=2] [ref=e31]
      - paragraph [ref=e32]: "Steel City Cleanouts started out of a simple observation: Pittsburgh families deserve better than the usual junk removal experience. No hidden fees, no four-hour arrival windows, no showing up with the wrong truck. We built this business to do it the right way, every time."
      - heading "What Makes Us Different" [level=2] [ref=e33]
      - list [ref=e34]:
        - listitem [ref=e35]:
          - strong [ref=e36]: Upfront pricing.
          - text: We tell you the price before we touch anything. No surprises.
        - listitem [ref=e37]:
          - strong [ref=e38]: Same-day service.
          - text: Most calls can be handled same day or next morning. No week-out scheduling.
        - listitem [ref=e39]:
          - strong [ref=e40]: Fully insured.
          - text: Our crews are insured, uniformed, and trained to protect your floors, walls, and doorways.
        - listitem [ref=e41]:
          - strong [ref=e42]: Donation-first.
          - text: Anything in good condition goes to local Pittsburgh charities when possible. We hate landfills too.
        - listitem [ref=e43]:
          - strong [ref=e44]: Family-owned.
          - text: Local owners answer the phone, do walk-throughs, and stand behind every job.
      - heading "Where We Work" [level=2] [ref=e45]
      - paragraph [ref=e46]: We serve Pittsburgh, Cranberry Township, Wexford, Mt. Lebanon, Monroeville, and every neighborhood and township in between. If you can get to Point State Park in under 45 minutes, we work your area.
    - generic [ref=e48]:
      - heading "Ready to Clear It Out?" [level=2] [ref=e49]
