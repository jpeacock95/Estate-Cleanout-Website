    - generic [ref=e59]:
      - paragraph [ref=e61]: Steel City Cleanouts offers estate cleanouts and same-day junk removal in Mt. Lebanon, PA (15228). Family-owned, fully insured. Call (585) 200-0871.
      - paragraph [ref=e62]: Mt. Lebanon's older brick homes and tight residential streets need a crew that knows what it's doing. Finished basements, narrow staircases, and detached garages are the norm here. We've done cleanouts on Washington Road, Beverly Road, and every side street in between. Most Mt. Lebanon homes were built between 1920 and 1960, and the staircases were sized for the furniture of that era, not today's sectionals. We know exactly how to disassemble and work around that.
      - paragraph [ref=e63]: Mt. Lebanon homes are mostly 1920s-1960s brick with finished basements and narrow back staircases. Older furniture is common in estate jobs. We disassemble when needed and carry it out piece by piece. Tight street parking means we coordinate arrival times carefully. Detached garages on rear alleys are common and typically hold decades of accumulated tools, holiday decorations, and yard equipment.
      - generic [ref=e64]:
        - heading "Why Mt. Lebanon Cleanouts Are Different" [level=2] [ref=e65]
        - paragraph [ref=e66]: Mt. Lebanon is one of the oldest streetcar suburbs in Pittsburgh, and its housing stock reflects that. Brick, plaster walls, narrow back staircases, detached garages, and finished basements with low ceilings. We've learned the quirks. Which staircases need a sectional disassembled in place, which alleys fit our trucks, which streets have meter enforcement on weekdays. We bring that knowledge to every South Hills job.
