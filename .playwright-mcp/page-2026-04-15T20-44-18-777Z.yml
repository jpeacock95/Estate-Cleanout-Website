    - generic [ref=e44]:
      - paragraph [ref=e46]: Steel City Cleanouts routes donatable items from Pittsburgh cleanouts to local partners including Goodwill, Construction Junction, and area furniture banks. Donation receipts available on request.
      - paragraph [ref=e47]: We hate landfills as much as you do. When cleanout items are in good enough condition to be reused, they go to local Pittsburgh partners, not the dump. Here's who we work with.
      - generic [ref=e48]:
        - generic [ref=e49]:
          - heading "Goodwill of Southwestern Pennsylvania" [level=2] [ref=e50]
          - paragraph [ref=e51]: Our first stop for clothing, housewares, working electronics, and small furniture. Multiple drop-off locations across Pittsburgh and the surrounding suburbs.
        - generic [ref=e52]:
          - heading "Construction Junction" [level=2] [ref=e53]
          - paragraph [ref=e54]: Pittsburgh's reuse center for building materials. Doors, windows, cabinets, fixtures, hardware, flooring, lumber. If it came out of a renovation and it's still usable, they take it.
        - generic [ref=e55]:
          - heading "Local furniture banks" [level=2] [ref=e56]
          - paragraph [ref=e57]: Couches, dining sets, beds, and dressers in good condition get routed to furniture banks serving families in transition across Allegheny and Butler counties.
        - generic [ref=e58]:
          - heading "St. Vincent de Paul Society" [level=2] [ref=e59]
          - paragraph [ref=e60]: Clothing, kitchen goods, small appliances, and household items. They support families across the Pittsburgh diocese.
        - generic [ref=e61]:
          - heading "Donation receipts" [level=2] [ref=e62]
          - paragraph [ref=e63]: If you need a donation receipt for estate tax purposes, let us know before the cleanout. We'll document the items that go to donation partners and provide a written list.
        - generic [ref=e64]:
          - heading "What can't be donated" [level=2] [ref=e65]
          - paragraph [ref=e66]: Broken furniture, stained mattresses, non-working appliances, outdated electronics (old CRTs), baby gear that doesn't meet current safety standards, and anything too worn to reuse. These go to licensed disposal and recycling facilities.
    - generic [ref=e68]:
