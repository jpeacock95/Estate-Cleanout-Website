    - generic [ref=e59]:
      - paragraph [ref=e61]: Steel City Cleanouts handles hoarder cleanouts in Pittsburgh, PA with discretion and zero judgment. Unmarked trucks on request, full PPE, multi-day jobs. Most fall between $2,000 and $8,000. Call (585) 200-0871.
      - paragraph [ref=e62]: Hoarder cleanouts are some of the hardest jobs we do. They're also some of the most important. We handle every Pittsburgh hoarder cleanout with discretion, patience, and zero judgment. Our crews arrive in unmarked trucks when requested, wear full PPE when needed, and work at a pace the family or property owner can actually handle emotionally and physically. Most jobs span 2 to 5 days because rushing a hoarder cleanout usually ends with important things getting thrown away by accident.
      - generic [ref=e63]:
        - heading "What a Typical Job Looks Like" [level=2] [ref=e64]
        - paragraph [ref=e65]: "A hoarder cleanout starts with a private walk-through (alone or with the family present, whatever works). We look at every room, ask about valuables, paperwork, and medications, and agree on a sorting plan. On job day, crews arrive early and go slow. Room by room, pile by pile. Everything goes into 4 categories: keep, donate, haul, and review later. The review pile sits on a central table for the homeowner or family to check at the end of each day. Biohazards (sharps, rodent droppings, spoiled food, animal waste) get handled with full PPE and proper disposal. We don't stop unless the family asks us to. Most jobs finish with a broom-swept house ready for cleaning and repairs."
