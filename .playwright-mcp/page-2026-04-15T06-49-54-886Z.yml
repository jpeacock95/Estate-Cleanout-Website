      - paragraph [ref=e61]: The minimum charge for junk removal with Steel City Cleanouts in Pittsburgh is $99 for a single item. That covers a mattress, couch, refrigerator, treadmill, or any similar single piece. Labor, truck, disposal, and donation routing are all included.
      - paragraph [ref=e62]: People ask about the minimum charge because they have just one thing to get rid of and they don't want to pay for a whole truck. Fair. Our minimum is $99 and it covers exactly that. One mattress, one couch, one appliance, one treadmill, one sofa bed. We pull up, load it, and haul it. No extra fees on top.
