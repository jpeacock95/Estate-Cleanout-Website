    - generic [ref=e63]:
      - paragraph [ref=e65]: Steel City Cleanouts offers same-day estate cleanouts in Pittsburgh, PA. Free on-site estimates. Most homes $800 to $3,500 depending on size and volume. Family-owned, fully insured. Call (585) 200-0871.
      - paragraph [ref=e66]: When Pittsburgh homeowners, landlords, and families need estate cleanouts, Steel City Cleanouts is the crew they call. We work every corner of Pittsburgh, PA, from Squirrel Hill, Shadyside, Lawrenceville and every street in between, and we bring the right equipment and crew size for the kinds of properties common here.
      - paragraph [ref=e67]: Estate cleanouts in Pittsburgh usually involve decades of accumulated belongings across multiple floors. Pittsburgh's hillside neighborhoods and row-house layouts make cleanouts physical work. Most Squirrel Hill and Shadyside homes have narrow staircases and finished basements. Lawrenceville row houses usually have tight alley access. South Side and Strip District lofts need freight-elevator booking or street permits. Mt. Washington homes sit on 30-degree slopes with stairs from street to front door. We handle all of it with the right crew size and the right gear.
